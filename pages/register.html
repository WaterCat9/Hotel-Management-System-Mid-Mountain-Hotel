<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Mid-Mountain Hotel</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>

<!-- ==================== 导航栏 ==================== -->
<nav class="navbar" id="navbar">
    <img src="../images/logo.png" alt="Mid-Mountain" class="nav-logo">
    <ul class="nav-links">
        <li><a href="../importantPages/index.html">Home</a></li>
        <li><a href="../subsystem2/main.html">Finance</a></li>
        <li><a href="../pages/About.html">About</a></li>
        <li><a href="../pages/Contact.html">Contact</a></li>
    </ul>
    <button class="nav-book-btn" onclick="window.location.href='../importantPages/subsystems.html'">Subsystems</button>
</nav>

<!-- ==================== 注册区域 ==================== -->
<section class="login-section">
    <div class="container">
        <div class="login-card">
            <h2>Create Account</h2>

            <div class="input-group">
                <label for="newcount">Username</label>
                <input type="text" id="newcount" placeholder="Enter username">
            </div>

            <div class="input-group">
                <label for="yourpassword">Password</label>
                <input type="password" id="yourpassword" placeholder="Enter password">
            </div>

            <div class="input-group">
                <label for="confirmpassword">Confirm Password</label>
                <input type="password" id="confirmpassword" placeholder="Confirm password">
            </div>

            <button class="login-btn" onclick="createAccount()">Create Account</button>

            <div class="login-links">
                <a href="../pages/login.html">Already have an account? Login</a>
            </div>
        </div>
    </div>
</section>

<!-- ==================== 页脚 ==================== -->
<footer>
    <div class="footer-content">
        <div class="footer-info">
            <h3>Mid-Mountain Hotel</h3>
            <p>© 2026 All rights reserved</p>
        </div>
        <div class="footer-contact">
            <p>WeiBo | Bilibili | Douyin</p>
            <p>Email: info@hotel.com</p>
            <p>Phone: +86 123 4567 8900</p>
        </div>
    </div>
</footer>

<script src="../js/time.js"></script>
<script src="../js/nav.js"></script>
<script>
    function createAccount() {
        var username = document.getElementById('newcount').value.trim();
        var pwd1 = document.getElementById('yourpassword').value;
        var pwd2 = document.getElementById('confirmpassword').value;

        if (username === '') {
            alert('Please enter a username.');
            return;
        }
        if (pwd1 === '') {
            alert('Please enter a password.');
            return;
        }
        if (pwd1 !== pwd2) {
            alert('Passwords do not match.');
            return;
        }

        alert('Account created successfully! Welcome, ' + username + '!');
        window.location.href = '../importantPages/subsystems.html';
    }
</script>

</body>
</html>
