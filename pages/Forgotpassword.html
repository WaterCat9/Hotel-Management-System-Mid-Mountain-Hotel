<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Mid-Mountain Hotel</title>
    <link rel="stylesheet" href="../css/components/nav.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>

<!-- ==================== 导航栏 ==================== -->
<nav class="navbar" id="navbar">
    <img src="../images/logo.png" alt="Mid-Mountain" class="nav-logo">
    <ul class="nav-links">
        <li><a href="../importantPages/index.html">Home</a></li>
        <li><a href="../subsystem2/main.html">Finance</a></li>
        <li><a href="../pages/About.html">About</a></li>
        <li><a href="../pages/Contact.html">Contact</a></li>
    </ul>
    <button class="nav-book-btn" onclick="window.location.href='../importantPages/subsystems.html'">Subsystems</button>
</nav>

<!-- ==================== 重置密码区域 ==================== -->
<section class="login-section">
    <div class="container">
        <div class="login-card">
            <h2>Reset Password</h2>

            <div class="input-group">
                <label for="recreate">New Password</label>
                <input type="password" id="recreate" placeholder="Enter new password">
            </div>

            <div class="input-group">
                <label for="newpassword">Confirm Password</label>
                <input type="password" id="newpassword" placeholder="Confirm new password">
            </div>

            <button class="login-btn" onclick="resetPassword()">Reset Password</button>

            <div class="login-links">
                <a href="../pages/login.html">Back to Login</a>
            </div>
        </div>
    </div>
</section>

<!-- ==================== 页脚 ==================== -->
<footer>
    <div class="footer-content">
        <div class="footer-info">
            <h3>Mid-Mountain Hotel</h3>
            <p>© 2026 All rights reserved</p>
        </div>
        <div class="footer-contact">
            <p>WeiBo | Bilibili | Douyin</p>
            <p>Email: info@hotel.com</p>
            <p>Phone: +86 123 4567 8900</p>
        </div>
    </div>
</footer>

<script src="../js/time.js"></script>
<script src="../js/nav.js"></script>
<script>
    function resetPassword() {
        var pwd1 = document.getElementById('recreate').value;
        var pwd2 = document.getElementById('newpassword').value;

        if (pwd1 === '' || pwd2 === '') {
            alert('Please fill in both fields.');
            return;
        }
        if (pwd1 !== pwd2) {
            alert('Passwords do not match.');
            return;
        }

        alert('Password reset successfully!');
        window.location.href = '../importantPages/subsystems.html';
    }
</script>

</body>
</html>
